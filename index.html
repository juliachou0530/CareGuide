<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a44">
<title>排球計分輪轉小幫手</title>
<meta name="description" content="場邊一個人用手機就能計分、追蹤輪轉站位、記錄得失分原因的排球小工具。">
<style>
:root{
  --bg:#f3efe7; --surface:#ffffff; --surface-2:#f8f5ef; --ink:#1b1f24; --muted:#6b6f76; --line:#e2dccf;
  --us:#1f5fbf; --us-soft:#dbe7fb; --them:#c2412d; --them-soft:#f9e0da;
  --court:#e9a86a; --court-line:#fff7ec; --court-ink:#3b2412; --front:#f2bb83; --back:#e39e5c;
  --accent:#f2c230; --ok:#2f8f5b; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.06);
  --board:#0f2a44; --board-ink:#ffffff; --primary:#0f2a44;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161c; --surface:#1a2029; --surface-2:#212833; --ink:#eef1f4; --muted:#9aa3ad; --line:#2d3540;
    --us:#5b9bff; --us-soft:#1d2f4d; --them:#ff7a62; --them-soft:#4a2620;
    --court:#8a5a33; --court-line:#d9c2a6; --court-ink:#fff4e6; --front:#9b6a40; --back:#7d4f2b;
    --board:#0a1724; --primary:#2f6fd6; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#1a2029; --surface-2:#212833; --ink:#eef1f4; --muted:#9aa3ad; --line:#2d3540;
  --us:#5b9bff; --us-soft:#1d2f4d; --them:#ff7a62; --them-soft:#4a2620;
  --court:#8a5a33; --court-line:#d9c2a6; --court-ink:#fff4e6; --front:#9b6a40; --back:#7d4f2b;
  --board:#0a1724; --primary:#2f6fd6; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  line-height:1.45;-webkit-tap-highlight-color:transparent;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px}
h1{font-size:18px;margin:0;letter-spacing:.02em}
h2{font-size:16px;margin:20px 0 8px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
.card{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.btn{min-height:48px;border-radius:12px;padding:0 16px;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--primary);color:#fff;border-color:transparent}
.btn.danger{color:var(--them)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.muted{color:var(--muted)}
.small{font-size:13px}
.hidden{display:none!important}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.top .theme{width:40px;height:40px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);font-size:18px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs .in{display:flex;max-width:560px;width:100%}
.tabs button{flex:1;padding:10px 0 12px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button .ic{font-size:20px;line-height:1}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700}

/* scoreboard */
.board{background:var(--board);color:var(--board-ink);border-radius:18px;padding:14px 14px 12px;box-shadow:var(--shadow)}
.board .meta{display:flex;justify-content:space-between;font-size:12px;opacity:.75;margin-bottom:6px}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.team{text-align:center;min-width:0}
.team .nm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team .sc{font-size:64px;font-weight:800;line-height:1;margin:4px 0}
.team.us .sc{color:#8fbaff}.team.them .sc{color:#ffab9a}
.team .serve{height:20px;font-size:13px}
.setsw{font-size:22px;font-weight:700;opacity:.9;text-align:center}
.setsw small{display:block;font-size:11px;font-weight:400;opacity:.7}
.history{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.history span{font-size:12px;background:rgba(255,255,255,.12);padding:2px 8px;border-radius:99px}

/* court */
.court-wrap{margin:12px 0}
.court{background:var(--court);border-radius:14px;padding:0 10px 10px;position:relative;border:3px solid var(--court-line)}
.net{height:14px;margin:0 -10px 8px;background:repeating-linear-gradient(90deg,var(--court-line) 0 2px,transparent 2px 8px),var(--board);border-radius:10px 10px 0 0;position:relative}
.net::after{content:"球網";position:absolute;right:10px;top:-1px;font-size:10px;color:#fff;opacity:.8}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid .attack-line{grid-column:1/-1;height:0;border-top:2px dashed var(--court-line);margin:2px 0;opacity:.9}
.pos{border-radius:10px;padding:8px 4px;text-align:center;color:var(--court-ink);position:relative;min-height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:2px solid transparent}
.pos.front{background:var(--front)}.pos.back{background:var(--back)}
.pos .pn{position:absolute;top:4px;left:6px;font-size:11px;opacity:.75}
.pos .jn{font-size:28px;font-weight:800;line-height:1}
.pos .pl{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos .rl{font-size:10px;font-weight:700;background:rgba(0,0,0,.18);color:#fff;padding:1px 6px;border-radius:99px}
.pos .rl.S{background:#7a3cc2}
.pos.server{border-color:var(--accent);box-shadow:0 0 0 3px rgba(242,194,48,.35)}
.pos.server::after{content:"🏐";position:absolute;top:2px;right:6px;font-size:14px}
.court-info{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:12px}

/* big point buttons */
.points{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.pbtn{min-height:92px;border-radius:18px;font-size:19px;font-weight:800;color:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pbtn small{font-weight:500;font-size:12px;opacity:.85}
.pbtn.us{background:var(--us)}.pbtn.them{background:var(--them)}
.pbtn:active{transform:scale(.97)}
.pbtn:disabled{opacity:.35}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tools .btn{padding:0 4px;font-size:13px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.tools .btn b{font-size:16px}

/* banner */
.banner{border-radius:16px;padding:16px;text-align:center;margin:12px 0;background:var(--surface);box-shadow:var(--shadow)}
.banner .big{font-size:24px;font-weight:800}

/* lineup editor */
.lineup{display:grid;gap:8px}
.lu{display:grid;grid-template-columns:40px 56px minmax(0,1fr) 104px;gap:6px;align-items:center}
.lu input,.lu select{padding:10px 8px}
.lu .p{font-weight:700;text-align:center;background:var(--surface-2);border-radius:10px;min-height:44px;display:flex;align-items:center;justify-content:center;font-size:13px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;min-height:40px;border-radius:9px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);font-weight:700}
.mini-court{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px;font-size:12px;text-align:center}
.mini-court div{background:var(--surface-2);border-radius:6px;padding:4px}

/* sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto;animation:up .18s ease-out}
.scrim.center{align-items:center;padding:16px}
.scrim.center .sheet{border-radius:20px}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 4px;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chips button{min-height:44px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);font-size:14px}
.chips button[aria-pressed="true"]{background:var(--primary);color:#fff;border-color:transparent}
.chips.players button{min-width:56px;font-weight:700}
.timer{font-size:84px;font-weight:800;text-align:center;line-height:1;margin:10px 0}

/* stats */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600}
td:first-child,th:first-child{text-align:left}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:96px 1fr 32px;gap:8px;align-items:center;font-size:13px}
.bar .t{height:14px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar .f{height:100%;border-radius:99px}
.worm svg{width:100%;height:auto;display:block}
.empty{text-align:center;padding:24px 8px;color:var(--muted)}
.log{max-height:260px;overflow:auto;font-size:13px}
.log div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);gap:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--board);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:30;box-shadow:var(--shadow);max-width:90vw;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🏐 排球計分輪轉小幫手</h1>
    <button class="theme" id="themeBtn" aria-label="切換深淺色">🌓</button>
  </div>

  <!-- SETUP -->
  <section id="view-setup" class="view">
    <div class="card">
      <div class="row">
        <div><label for="usName">我方隊名</label><input id="usName" placeholder="例：北醫女排" maxlength="16"></div>
        <div><label for="themName">對手隊名</label><input id="themName" placeholder="例：對手" maxlength="16"></div>
      </div>
      <div style="margin-top:12px">
        <label>賽制</label>
        <div class="seg" id="bestOf">
          <button data-v="3" aria-pressed="true">三戰兩勝</button>
          <button data-v="5" aria-pressed="false">五戰三勝</button>
        </div>
      </div>
      <div class="row" style="margin-top:12px">
        <div><label for="setPts">一般局分數</label><input id="setPts" type="number" inputmode="numeric" min="5" max="50" value="25"></div>
        <div><label for="decPts">決勝局分數</label><input id="decPts" type="number" inputmode="numeric" min="5" max="50" value="15"></div>
      </div>
      <div style="margin-top:12px">
        <label>第一局由誰先發球</label>
        <div class="seg" id="firstServe">
          <button data-v="us" aria-pressed="true">我方發球</button>
          <button data-v="them" aria-pressed="false">對方發球</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2 style="margin-top:0">我方先發站位</h2>
      <p class="small muted" style="margin:0 0 10px">1 號位是右後（發球位）。前排 4・3・2，後排 5・6・1。</p>
      <div class="lineup" id="lineupEd"></div>
      <div class="mini-court" id="miniCourt"></div>
    </div>

    <button class="btn primary" id="startBtn" style="width:100%;min-height:56px;font-size:17px">開始比賽</button>
    <p class="small muted" id="setupLock" style="text-align:center"></p>
    <button class="btn danger hidden" id="newMatchBtn" style="width:100%;margin-top:8px">🗑 結束並開新比賽</button>
    <p class="small muted" style="margin-top:16px">規則依據：FIVB Official Volleyball Rules 2025–2028（6.2 局勝負、6.3.2 決勝局、7.6.2 輪轉、15.1 暫停與換人）。資料只存在這台裝置的瀏覽器。</p>
  </section>

  <!-- GAME -->
  <section id="view-game" class="view hidden">
    <div class="board">
      <div class="meta"><span id="setLabel">第 1 局</span><span id="targetLabel">25 分</span></div>
      <div class="teams">
        <div class="team us"><div class="nm" id="bUsName">我方</div><div class="sc num" id="bUs">0</div><div class="serve" id="sUs"></div></div>
        <div class="setsw num"><span id="bSets">0 : 0</span><small>局數</small></div>
        <div class="team them"><div class="nm" id="bThemName">對手</div><div class="sc num" id="bThem">0</div><div class="serve" id="sThem"></div></div>
      </div>
      <div class="history" id="setHistory"></div>
    </div>

    <div class="banner hidden" id="overBanner"></div>

    <div class="points">
      <button class="pbtn us" id="ptUs">＋ 我方得分<small id="ptUsSub">&nbsp;</small></button>
      <button class="pbtn them" id="ptThem">＋ 對方得分<small id="ptThemSub">&nbsp;</small></button>
    </div>

    <div class="tools">
      <button class="btn" id="undoBtn"><b>↶</b>復原</button>
      <button class="btn" id="toUs"><b>⏱</b><span id="toUsL">我方暫停</span></button>
      <button class="btn" id="toThem"><b>⏱</b><span id="toThemL">對方暫停</span></button>
      <button class="btn" id="subBtn"><b>⇄</b><span id="subL">換人</span></button>
    </div>

    <div class="court-wrap">
      <div class="court">
        <div class="net"></div>
        <div class="grid" id="court"></div>
      </div>
      <div class="court-info">
        <span class="chip" id="sRot">舉球 S1 輪</span>
        <span class="row" style="flex:0 0 auto;gap:6px">
          <button class="chip" id="rotBack" aria-label="逆時針輪轉修正">↺ −1</button>
          <button class="chip" id="rotFwd" aria-label="順時針輪轉修正">↻ +1</button>
        </span>
      </div>
      <p class="small muted" style="margin:6px 0 0">點場上球員可直接換人。我方接發球得分（side-out）時會自動順時針輪轉。</p>
    </div>
  </section>

  <!-- STATS -->
  <section id="view-stats" class="view hidden">
    <div id="statsBody"></div>
  </section>
</div>

<nav class="tabs"><div class="in" role="tablist">
  <button role="tab" data-view="setup" aria-selected="true"><span class="ic">📋</span>設定</button>
  <button role="tab" data-view="game" aria-selected="false"><span class="ic">🏐</span>比賽</button>
  <button role="tab" data-view="stats" aria-selected="false"><span class="ic">📊</span>數據</button>
</div></nav>

<div id="modalRoot"></div>

<script>
(() => {
'use strict';
const KEY = 'vca-v1';
const ROLES = ['S','OH','MB','OP','L'];
const ROLE_ZH = {S:'舉球',OH:'大砲',MB:'副攻',OP:'舉對',L:'自由'};
// Index i = position (i+1). Display order on court: front 4,3,2 / back 5,6,1
const DISPLAY = [4,3,2,5,6,1];
const REASONS = {
  us:   [{k:'ace',t:'發球得分',p:true},{k:'kill',t:'攻擊得分',p:true},{k:'block',t:'攔網得分',p:true},{k:'oppErr',t:'對方失誤',p:false}],
  them: [{k:'srvErr',t:'我方發球失誤',p:true},{k:'atkErr',t:'我方攻擊失誤',p:true},{k:'blocked',t:'被攔死',p:true},{k:'rcvErr',t:'接發失誤',p:true},{k:'othErr',t:'其他失誤',p:true},{k:'oppKill',t:'對方攻擊得分',p:false}]
};
const REASON_T = Object.fromEntries([...REASONS.us,...REASONS.them].map(r=>[r.k,r.t]));

const defaultSetup = () => ({
  usName:'', themName:'', bestOf:3, setPts:25, decPts:15, firstServe:'us',
  starters:[{num:'1',name:'',role:'S'},{num:'2',name:'',role:'OH'},{num:'3',name:'',role:'MB'},{num:'4',name:'',role:'OP'},{num:'5',name:'',role:'OH'},{num:'6',name:'',role:'MB'}]
});

let data = load() || {setup: defaultSetup(), started:false, events:[]};
let S = null;            // derived state
let view = data.started ? 'game' : 'setup';

function load(){ try{ const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){} }
const $ = id => document.getElementById(id);
const other = t => t==='us' ? 'them' : 'us';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usN = () => data.setup.usName || '我方';
const thN = () => data.setup.themName || '對手';

// ---------- core: rebuild state by replaying events ----------
function rotateCW(l){ return [l[1],l[2],l[3],l[4],l[5],l[0]]; }   // pos2→1, 3→2 ... 1→6 (rule 7.6.2)
function rotateCCW(l){ return [l[5],l[0],l[1],l[2],l[3],l[4]]; }

function replay(){
  const su = data.setup;
  const need = Math.ceil(su.bestOf/2);
  const st = {
    set:1, sets:{us:0,them:0}, score:{us:0,them:0}, serving:su.firstServe, setFirst:su.firstServe,
    lineup: su.starters.map(p=>({...p})), timeouts:{us:0,them:0}, subs:0,
    setLog:[], rallies:[], over:false, winner:null, need
  };
  const target = () => st.set === su.bestOf ? su.decPts : su.setPts;
  for(const e of data.events){
    if(st.over) break;
    if(e.type==='point'){
      const t = e.team;
      const sideOut = t==='us' && st.serving==='them';
      const server = st.serving==='us' ? st.lineup[0] : null;
      if(sideOut) st.lineup = rotateCW(st.lineup);
      st.serving = t;
      st.score[t]++;
      st.rallies.push({set:st.set, team:t, us:st.score.us, them:st.score.them, reason:e.reason||'', player:e.player||'', server: server ? server.num : '', sideOut});
      const tg = target();
      if(st.score[t] >= tg && st.score[t]-st.score[other(t)] >= 2){
        st.setLog.push({set:st.set, us:st.score.us, them:st.score.them, winner:t});
        st.sets[t]++;
        if(st.sets[t] >= need){ st.over = true; st.winner = t; }
        else {
          st.set++; st.score={us:0,them:0}; st.timeouts={us:0,them:0}; st.subs=0;
          st.lineup = su.starters.map(p=>({...p}));
          st.setFirst = other(st.setFirst); st.serving = st.setFirst;
        }
      }
    } else if(e.type==='rotate'){
      st.lineup = e.dir>0 ? rotateCW(st.lineup) : rotateCCW(st.lineup);
    } else if(e.type==='timeout'){
      st.timeouts[e.team]++;
    } else if(e.type==='sub'){
      st.lineup[e.idx] = {num:e.num, name:e.name||'', role:e.role||''};
      st.subs++;
    }
  }
  st.target = target();
  return st;
}

function push(e){ data.events.push(e); save(); render(); }
function lastPointEvent(){ for(let i=data.events.length-1;i>=0;i--){ if(data.events[i].type==='point') return data.events[i]; } return null; }

// ---------- setup view ----------
function renderSetup(){
  const su = data.setup, locked = data.started;
  $('usName').value = su.usName; $('themName').value = su.themName;
  $('setPts').value = su.setPts; $('decPts').value = su.decPts;
  for(const b of $('bestOf').children) b.setAttribute('aria-pressed', String(+b.dataset.v===su.bestOf));
  for(const b of $('firstServe').children) b.setAttribute('aria-pressed', String(b.dataset.v===su.firstServe));
  $('lineupEd').innerHTML = su.starters.map((p,i)=>`
    <div class="lu">
      <div class="p">${i+1}號位</div>
      <input data-i="${i}" data-f="num" value="${esc(p.num)}" inputmode="numeric" maxlength="3" placeholder="背號" aria-label="${i+1}號位背號">

    </div>`).join('');
  $('miniCourt').innerHTML = DISPLAY.map(pos=>{const p=su.starters[pos-1];return `<div><span class="muted">${pos}</span> #${esc(p.num)} ${esc(p.role)}</div>`}).join('');

function bindSetup(){

  $('themName').addEventListener('input', e=>{su().themName=e.target.value.trim(); save();});

  $('firstServe').addEventListener('click', e=>{const b=e.target.closest('button'); if(!b||data.started) return; su().firstServe=b.dataset.v; save(); renderSetup();});
  $('lineupEd').addEventListener('input', e=>{
    const el=e.target; if(!el.dataset.f) return;
    su().starters[+el.dataset.i][el.dataset.f] = el.value.trim(); save();
    $('miniCourt').innerHTML = DISPLAY.map(pos=>{const p=su().starters[pos-1];return `<div><span class="muted">${pos}</span> #${esc(p.num)} ${esc(p.role)}</div>`}).join('');
  });
  $('startBtn').addEventListener('click', ()=>{
    if(data.started){ setView(S.over?'stats':'game'); return; }
    const nums = su().starters.map(p=>p.num);
    if(nums.some(n=>!n)){ toast('請填滿 6 位先發的背號'); return; }
    if(new Set(nums).size!==6){ toast('背號重複了，請檢查'); return; }
    data.started = true; data.events = []; save(); render(); setView('game');
  });
  $('newMatchBtn').addEventListener('click', ()=>{
    confirmModal('開新比賽？','目前比賽的比分與紀錄會被清除（先發名單會保留）。建議先到「數據」匯出 CSV。','清除並開新比賽', ()=>{
      data.started=false; data.events=[]; save(); render(); setView('setup');
    });
  });
}
function clampInt(v,lo,hi,d){ v=parseInt(v,10); return isNaN(v)?d:Math.max(lo,Math.min(hi,v)); }

// ---------- game view ----------
function renderGame(){
  const s = S;
  $('bUsName').textContent = usN(); $('bThemName').textContent = thN();
  $('bUs').textContent = s.score.us; $('bThem').textContent = s.score.them;
  $('bSets').textContent = `${s.sets.us} : ${s.sets.them}`;
  $('setLabel').textContent = s.over ? '比賽結束' : `第 ${s.set} 局${s.set===data.setup.bestOf?'（決勝局）':''}`;
  $('targetLabel').textContent = s.over ? '' : `${s.target} 分・領先 2 分`;
  $('sUs').textContent = !s.over && s.serving==='us' ? `🏐 #${s.lineup[0].num} 發球` : '';
  $('sThem').textContent = !s.over && s.serving==='them' ? '🏐 發球' : '';
  $('setHistory').innerHTML = s.setLog.map(l=>`<span class="num">S${l.set} ${l.us}–${l.them}</span>`).join('');

  // set / match point hints
  const hint = t => {
    if(s.over) return '&nbsp;';
    const me=s.score[t], op=s.score[other(t)];
    if(me+1>=s.target && me+1-op>=2) return s.sets[t]+1>=s.need ? '賽末點' : '局末點';
    return '&nbsp;';
  };
  $('ptUsSub').innerHTML = hint('us'); $('ptThemSub').innerHTML = hint('them');
  $('ptUs').disabled = $('ptThem').disabled = s.over;

  $('toUsL').textContent = `我方暫停 ${s.timeouts.us}/2`;
  $('toThemL').textContent = `對方暫停 ${s.timeouts.them}/2`;
  $('toUs').disabled = s.over || s.timeouts.us>=2;
  $('toThem').disabled = s.over || s.timeouts.them>=2;
  $('subL').textContent = `換人 ${s.subs}/6`;
  $('subBtn').disabled = s.over || s.subs>=6;
  $('undoBtn').disabled = data.events.length===0;
  $('rotBack').disabled = $('rotFwd').disabled = s.over;

  $('court').innerHTML = DISPLAY.map((pos,k)=>{
    const p = s.lineup[pos-1];
    const front = pos>=2 && pos<=4;
    const server = pos===1 && s.serving==='us' && !s.over;
    return (k===3?'<div class="attack-line" aria-hidden="true"></div>':'') +
      `<button class="pos ${front?'front':'back'} ${server?'server':''}" data-idx="${pos-1}" aria-label="${pos}號位 背號${esc(p.num)}">
        <span class="pn">${pos}</span>
        <span class="jn num">${esc(p.num)}</span>
        ${p.name?`<span class="pl">${esc(p.name)}</span>`:''}
        ${p.role?`<span class="rl ${esc(p.role)}">${esc(p.role)}</span>`:''}
      </button>`;
  }).join('');
  const sIdx = s.lineup.findIndex(p=>p.role==='S');
  $('sRot').textContent = sIdx>=0 ? `舉球在 ${sIdx+1} 號位（S${sIdx+1} 輪）` : '場上沒有標記舉球員';

  const ob = $('overBanner');
  if(s.over){
    ob.classList.remove('hidden');
    const win = s.winner==='us';
    ob.innerHTML = `<div class="big">${win?'🎉 '+esc(usN())+' 獲勝！':esc(thN())+' 獲勝'}</div>
      <div class="muted num" style="margin:4px 0 10px">${s.sets.us} : ${s.sets.them}　（${s.setLog.map(l=>l.us+'–'+l.them).join('、')}）</div>
      <button class="btn primary" id="goStats">看本場數據 📊</button>`;
    $('goStats').onclick = ()=>setView('stats');
  } else ob.classList.add('hidden');
}

function bindGame(){
  $('ptUs').addEventListener('click', ()=>scorePoint('us'));
  $('ptThem').addEventListener('click', ()=>scorePoint('them'));
  $('undoBtn').addEventListener('click', ()=>{
    const e = data.events.pop(); save(); render();
    if(e) toast('已復原：' + describe(e));
  });
  $('toUs').addEventListener('click', ()=>{ push({type:'timeout',team:'us'}); timerModal(usN()+' 暫停'); });
  $('toThem').addEventListener('click', ()=>{ push({type:'timeout',team:'them'}); timerModal(thN()+' 暫停'); });
  $('subBtn').addEventListener('click', ()=>subModal(null));
  $('court').addEventListener('click', e=>{ const b=e.target.closest('.pos'); if(b && !S.over && S.subs<6) subModal(+b.dataset.idx); else if(b && S.subs>=6) toast('本局 6 次換人已用完'); });
  $('rotFwd').addEventListener('click', ()=>{ push({type:'rotate',dir:1}); toast('已手動順時針輪轉'); });
  $('rotBack').addEventListener('click', ()=>{ push({type:'rotate',dir:-1}); toast('已手動逆時針輪轉'); });
}

function describe(e){
  if(e.type==='point') return (e.team==='us'?usN():thN())+' 得分'+(e.reason?'（'+REASON_T[e.reason]+'）':'');
  if(e.type==='timeout') return (e.team==='us'?usN():thN())+' 暫停';
  if(e.type==='sub') return '換人 #'+e.num;
  if(e.type==='rotate') return '手動輪轉';
  return '';
}

function scorePoint(team){
  if(S.over) return;
  const before = S;
  const serverBefore = before.serving==='us' ? before.lineup[0] : null;
  const onCourt = before.lineup.map(p=>p.num);
  const ev = {type:'point', team};
  push(ev);
  if(navigator.vibrate) try{ navigator.vibrate(15); }catch(e){}
  const after = S;
  if(after.set!==before.set || after.over){
    const l = after.setLog[after.setLog.length-1];
    toast(`第 ${l.set} 局結束 ${l.us}–${l.them}，${l.winner==='us'?usN():thN()} 拿下`);
  } else if(team==='us' && before.serving==='them'){
    toast('Side-out！我方順時針輪轉，#'+after.lineup[0].num+' 發球');
  }
  reasonSheet(ev, team, onCourt, serverBefore ? serverBefore.num : '');
}

// ---------- modals ----------
function openModal(html, center){
  const root = $('modalRoot');
  root.innerHTML = `<div class="scrim ${center?'center':''}"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const scrim = root.firstChild;
  scrim.addEventListener('click', e=>{ if(e.target===scrim) closeModal(); });
  return scrim.querySelector('.sheet');
}
let timerInt = null;
function closeModal(){ $('modalRoot').innerHTML=''; if(timerInt){clearInterval(timerInt); timerInt=null;} }

function reasonSheet(ev, team, onCourt, serverNum){
  const list = REASONS[team];
  const sh = openModal(`
    <h3>${team==='us'?'我方':'對方'}得分：怎麼來的？</h3>
    <p class="small muted" style="margin:0">可略過，之後不會影響比分。</p>
    <div class="chips" id="rsn">${list.map(r=>`<button data-k="${r.k}" aria-pressed="false">${r.t}</button>`).join('')}</div>
    <div id="plWrap" class="hidden">
      <p class="small muted" style="margin:6px 0 0">是哪位球員？</p>
      <div class="chips players" id="pls">${onCourt.map(n=>`<button data-n="${esc(n)}" aria-pressed="false">#${esc(n)}</button>`).join('')}</div>
    </div>
    <div class="row" style="margin-top:8px"><button class="btn" id="rsSkip">略過</button><button class="btn primary" id="rsOk">完成</button></div>`);
  let reason=null, player=null;
  const syncPress = (box, attr, val) => box.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset[attr]===val)));
  sh.querySelector('#rsn').addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b) return;
    reason=b.dataset.k; syncPress(sh.querySelector('#rsn'),'k',reason);
    const needP = list.find(r=>r.k===reason).p;
    sh.querySelector('#plWrap').classList.toggle('hidden', !needP);
    if(!needP){ player=null; }
    else if((reason==='ace'||reason==='srvErr') && serverNum){ player=serverNum; syncPress(sh.querySelector('#pls'),'n',player); }
    if(!needP) commit();
  });
  sh.querySelector('#pls').addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b) return;
    player=b.dataset.n; syncPress(sh.querySelector('#pls'),'n',player); commit();
  });
  const commit = () => {
    if(data.events.includes(ev)){ ev.reason = reason||''; ev.player = player||''; save(); render(); }
    closeModal();
  };
  sh.querySelector('#rsSkip').onclick = closeModal;
  sh.querySelector('#rsOk').onclick = commit;
}

function timerModal(title){
  let left = 30;
  const sh = openModal(`<h3 style="text-align:center">${esc(title)}</h3><div class="timer num" id="tm">30</div>
    <p class="small muted" style="text-align:center;margin:0 0 12px">規則 15.4.1：暫停 30 秒</p>
    <button class="btn primary" style="width:100%" id="tmClose">結束暫停</button>`, true);
  sh.querySelector('#tmClose').onclick = closeModal;
  timerInt = setInterval(()=>{ left--; const el=$('tm'); if(!el){clearInterval(timerInt);return;} el.textContent=Math.max(left,0); if(left<=0){ el.textContent='時間到'; el.style.fontSize='48px'; clearInterval(timerInt); timerInt=null; if(navigator.vibrate) try{navigator.vibrate([200,100,200]);}catch(e){} } },1000);
}

let toastT=null;

  if(!el){ el=document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); document.body.appendChild(el); }
  el.textContent = msg; el.style.display='block';
  clearTimeout(toastT); toastT=setTimeout(()=>{ el.style.display='none'; },2200);
}

// ---------- stats ----------
function renderStats(){
  const s = S, R = s.rallies;
  if(!data.started || R.length===0){
    $('statsBody').innerHTML = `<div class="card empty">還沒有任何得分紀錄。<br>開始比賽後，每一分的原因與球員都會統計在這裡。</div>`;
    return;
  }
  const usPts = R.filter(r=>r.team==='us').length, thPts = R.length-usPts;
  // per player
  const P = {};
  const addP = (n,k) => { if(!n) return; (P[n] ||= {ace:0,kill:0,block:0,err:0}); P[n][k]++; };
  for(const r of R){
    if(r.reason==='ace') addP(r.player,'ace');
    else if(r.reason==='kill') addP(r.player,'kill');
    else if(r.reason==='block') addP(r.player,'block');
    else if(['srvErr','atkErr','blocked','rcvErr','othErr'].includes(r.reason)) addP(r.player,'err');
  }
  const names = {};
  data.setup.starters.forEach(p=>{ if(p.name) names[p.num]=p.name; });
  data.events.forEach(e=>{ if(e.type==='sub' && e.name) names[e.num]=e.name; });
  const rows = Object.entries(P).map(([n,v])=>({n,...v,pts:v.ace+v.kill+v.block})).sort((a,b)=>b.pts-a.pts||a.err-b.err);

  const countBy = team => {
    const c = {}; REASONS[team].forEach(r=>c[r.k]=0); c[''] = 0;
    R.filter(r=>r.team===team).forEach(r=>c[r.reason||'']++);
    return c;
  };
  const cu = countBy('us'), ct = countBy('them');
  const barList = (team,c,color) => {
    const max = Math.max(1,...Object.values(c));
    return [...REASONS[team].map(r=>[r.t,c[r.k]]), ['未標記',c['']]].filter(x=>x[1]>0 || x[0]!=='未標記')
      .map(([t,v])=>`<div class="bar"><span>${t}</span><span class="t"><span class="f" style="width:${v/max*100}%;background:${color}"></span></span><span class="num" style="text-align:right">${v}</span></div>`).join('');
  };

  const sets = [...new Set(R.map(r=>r.set))];
  const sideOuts = R.filter(r=>r.sideOut).length;
  const recvRallies = R.filter(r=>r.server==='').length; // rallies where the opponent served
  const soPct = recvRallies ? Math.round(sideOuts/recvRallies*100) : 0;

  $('statsBody').innerHTML = `
    <div class="card">
      <div class="row" style="text-align:center">
        <div><div class="muted small">${esc(usN())} 得分</div><div class="num" style="font-size:30px;font-weight:800;color:var(--us)">${usPts}</div></div>
        <div><div class="muted small">${esc(thN())} 得分</div><div class="num" style="font-size:30px;font-weight:800;color:var(--them)">${thPts}</div></div>
        <div><div class="muted small">接發轉換率</div><div class="num" style="font-size:30px;font-weight:800">${soPct}%</div></div>
      </div>
      <p class="small muted" style="margin:8px 0 0">接發轉換率（side-out %）＝ 我方接發球時拿下該分的比例（${sideOuts}/${recvRallies}）。</p>
    </div>

    <div class="card"><h2 style="margin-top:0">比分走勢</h2>
      <p class="small muted" style="margin:0 0 8px">線往上 = ${esc(usN())} 領先，往下 = ${esc(thN())} 領先。</p>
      ${sets.map(n=>worm(R.filter(r=>r.set===n), n)).join('')}
    </div>

    <div class="card"><h2 style="margin-top:0">球員數據</h2>
      ${rows.length ? `<table><thead><tr><th>球員</th><th>發球</th><th>攻擊</th><th>攔網</th><th>得分</th><th>失誤</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td><b>#${esc(r.n)}</b> ${esc(names[r.n]||'')}</td><td class="num">${r.ace}</td><td class="num">${r.kill}</td><td class="num">${r.block}</td><td class="num"><b>${r.pts}</b></td><td class="num">${r.err}</td></tr>`).join('')}
      </tbody></table>` : `<p class="muted small">得分時選擇「原因＋球員」，這裡就會出現個人數據。</p>`}
    </div>

    <div class="card"><h2 style="margin-top:0">我方得分來源</h2><div class="bars">${barList('us',cu,'var(--us)')}</div></div>
    <div class="card"><h2 style="margin-top:0">我方失分原因</h2><div class="bars">${barList('them',ct,'var(--them)')}</div></div>

    <div class="card"><h2 style="margin-top:0">逐分紀錄</h2>
      <div class="log">${R.slice().reverse().map(r=>`<div><span><span class="dot" style="background:var(--${r.team})"></span>S${r.set}　${r.team==='us'?esc(usN()):esc(thN())}${r.reason?'・'+REASON_T[r.reason]:''}${r.player?' #'+esc(r.player):''}</span><span class="num">${r.us}–${r.them}</span></div>`).join('')}</div>
      <button class="btn" style="width:100%;margin-top:10px" id="csvBtn">⬇ 匯出 CSV</button>
    </div>`;
  $('csvBtn').onclick = exportCSV;
}

function worm(list, setNo){
  const W=320, H=110, pad=8, n=list.length;
  let d=0; const pts=[[0,0]];
  list.forEach((r,i)=>{ d += r.team==='us'?1:-1; pts.push([i+1,d]); });
  const m = Math.max(3,...pts.map(p=>Math.abs(p[1])));
  const x = i => pad + i/(Math.max(n,1))*(W-2*pad), y = v => H/2 - v/m*(H/2-pad);
  const path = pts.map((p,i)=>(i?'L':'M')+x(p[0]).toFixed(1)+' '+y(p[1]).toFixed(1)).join(' ');
  const last = list[list.length-1];
  return `<div class="worm" style="margin-bottom:10px">
    <div class="small" style="display:flex;justify-content:space-between"><b>第 ${setNo} 局</b><span class="num">${last.us}–${last.them}</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="第${setNo}局比分差走勢">
      <rect x="0" y="0" width="${W}" height="${H/2}" fill="var(--us-soft)" opacity=".55"/>
      <rect x="0" y="${H/2}" width="${W}" height="${H/2}" fill="var(--them-soft)" opacity=".55"/>
      <line x1="0" x2="${W}" y1="${H/2}" y2="${H/2}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>
      <path d="${path}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    </svg></div>`;
}

function exportCSV(){
  const head = ['set','rally','scored_by','us','them','reason','player','our_server','side_out'];
  const lines = [head.join(',')];
  const cnt = {};
  S.rallies.forEach(r=>{
    cnt[r.set]=(cnt[r.set]||0)+1;
    const row=[r.set,cnt[r.set],r.team==='us'?usN():thN(),r.us,r.them,r.reason?REASON_T[r.reason]:'',r.player,r.server,r.sideOut?'Y':''];
    lines.push(row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));
  });
  const blob = new Blob(['﻿'+lines.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `volleyball_${usN()}_vs_${thN()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  toast('已匯出 CSV');
}

// ---------- shell ----------
function setView(v){
  if(v!=='setup' && !data.started){ toast('請先完成設定並按「開始比賽」'); v='setup'; }
  view = v;
  for(const sec of document.querySelectorAll('.view')) sec.classList.toggle('hidden', sec.id!=='view-'+v);
  for(const b of document.querySelectorAll('.tabs button')) b.setAttribute('aria-selected', String(b.dataset.view===v));
  render(); window.scrollTo(0,0);
}
function render(){
  S = replay();
  if(view==='setup') renderSetup();
  if(view==='game') renderGame();
  if(view==='stats') renderStats();
}
document.querySelector('.tabs').addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) setView(b.dataset.view); });

// theme toggle
(function(){
  let t=null; try{ t=localStorage.getItem(KEY+'-theme'); }catch(e){}
  if(t) document.documentElement.dataset.theme=t;
  $('themeBtn').addEventListener('click', ()=>{
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    const nx = cur==='dark'?'light':'dark';
    document.documentElement.dataset.theme = nx;
    try{ localStorage.setItem(KEY+'-theme', nx); }catch(e){}
  });
})();

bindSetup(); bindGame();
setView(view);
// expose for testing
window.__vca = { get state(){ return S; }, get data(){ return data; } };
})();
</script>
